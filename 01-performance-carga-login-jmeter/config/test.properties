# Propiedades de la prueba de carga del login. Se cargan con: -q config/test.properties

# APDEX del dashboard: una respuesta es satisfactoria hasta 1.500 ms, el máximo que permite el enunciado,
# y tolerable hasta 4 veces ese valor, la proporción que usa APDEX por defecto
jmeter.reportgenerator.apdex_satisfied_threshold=1500
jmeter.reportgenerator.apdex_tolerated_threshold=6000

# Gráficos del dashboard por segundo, para ver si la tasa se sostiene por encima de 20 TPS
jmeter.reportgenerator.overall_granularity=1000

# Título del dashboard
jmeter.reportgenerator.report_title=Prueba de carga del login - fakestoreapi.com

# Resultados (.jtl) en CSV con los campos que usa el dashboard y el mensaje de cada error
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.assertion_results_failure_message=true
jmeter.save.saveservice.thread_counts=true
jmeter.save.saveservice.latency=true
jmeter.save.saveservice.connect_time=true

# Resumen en la consola cada 30 segundos
summariser.interval=30
